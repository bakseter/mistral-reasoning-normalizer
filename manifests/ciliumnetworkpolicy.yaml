apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mistral-reasoning-normalizer
  namespace: agentgateway-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mistral-reasoning-normalizer

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentgateway-proxy
            gateway.networking.k8s.io/gateway-name: agentgateway-proxy
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP

  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: '53'
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'

    - toFQDNs:
        - matchName: 'api.mistral.ai'
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
